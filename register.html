<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - RML Construction Supply</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      position: relative;
      background-color: #ffffff;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('https://i.pinimg.com/736x/ba/f6/29/baf629275e49653b0013ca5ecd4d0361.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0.5;
      z-index: -1;
    }
  </style>
</head>

<body class="bg-light min-vh-100 d-flex align-items-center justify-content-center p-3">

  <div class="card shadow-lg border-danger-subtle rounded-4 w-100" style="max-width: 480px;">

    <div class="card-header bg-danger text-white text-center py-4 rounded-top-4">
      <h2 class="h4 fw-bold mb-1">RML Construction Supply</h2>
      <p class="small mb-0 opacity-75">Create a new account</p>
    </div>

    <div class="card-body p-4 p-sm-5 bg-white">

      <form id="registerForm">

        <div class="mb-3">
          <label for="fullNameInput" class="form-label fw-semibold text-dark">
            Full Name
          </label>

          <input type="text"
                 class="form-control border-danger-subtle"
                 id="fullNameInput"
                 placeholder="Theresa Atienza">

          <div id="nameError" class="text-danger small mt-1"></div>
        </div>

        <div class="mb-3">
          <label for="emailInput" class="form-label fw-semibold text-dark">
            Email Address
          </label>

          <input type="text"
                 class="form-control border-danger-subtle"
                 id="emailInput"
                 placeholder="theresa@example.com">

          <div id="emailError" class="text-danger small mt-1"></div>
        </div>

        <div class="mb-3">
          <label for="passwordInput" class="form-label fw-semibold text-dark">
            Password
          </label>

          <input type="password"
                 class="form-control border-danger-subtle"
                 id="passwordInput"
                 placeholder="Create a password">

          <div id="passwordError" class="text-danger small mt-1"></div>
        </div>

        <div class="mb-3">
          <label for="confirmPasswordInput" class="form-label fw-semibold text-dark">
            Confirm Password
          </label>

          <input type="password"
                 class="form-control border-danger-subtle"
                 id="confirmPasswordInput"
                 placeholder="Re-enter your password">

          <div id="confirmError" class="text-danger small mt-1"></div>
        </div>

        <div class="mb-4 form-check">

          <input class="form-check-input"
                 type="checkbox"
                 id="termsCheck">

          <label class="form-check-label small text-muted" for="termsCheck">
            I agree to the
            <a href="#" class="text-danger text-decoration-none">
              Terms & Conditions
            </a>
          </label>

          <div id="termsError" class="text-danger small mt-1"></div>

        </div>

        <div id="registerMessage" class="small mb-3"></div>

        <button type="submit"
                class="btn btn-danger w-100 py-2 fw-semibold shadow-sm">
          Register
        </button>

      </form>

    </div>

    <div class="card-footer bg-light text-center py-3 rounded-bottom-4 border-0">

      <span class="small text-muted">
        Already have an account?
      </span>

      <a href="login.html"
         class="small text-danger fw-bold text-decoration-none">
        Sign In
      </a>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>

  <script>
    $(document).ready(function() {

      $("#registerForm").submit(function(e) {
        e.preventDefault();

        var name = $("#fullNameInput").val().trim();
        var email = $("#emailInput").val().trim();
        var password = $("#passwordInput").val();
        var confirmPassword = $("#confirmPasswordInput").val();
        var terms = $("#termsCheck").is(":checked");

        $("#nameError").text("");
        $("#emailError").text("");
        $("#passwordError").text("");
        $("#confirmError").text("");
        $("#termsError").text("");
        $("#registerMessage").text("");

        var valid = true;

        if (name === "") {
          $("#nameError").text("Full name is required.");
          valid = false;
        } else if (name.length < 2) {
          $("#nameError").text("Please enter your full name.");
          valid = false;
        }

        if (email === "") {
          $("#emailError").text("Email address is required.");
          valid = false;
        } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          $("#emailError").text("Please enter a valid email address.");
          valid = false;
        }

        if (password === "") {
          $("#passwordError").text("Password is required.");
          valid = false;
        } else if (password.length < 6) {
          $("#passwordError").text("Password must be at least 6 characters.");
          valid = false;
        }

        if (confirmPassword === "") {
          $("#confirmError").text("Please confirm your password.");
          valid = false;
        } else if (password !== confirmPassword) {
          $("#confirmError").text("Passwords do not match.");
          valid = false;
        }

        if (!terms) {
          $("#termsError").text("Please agree to the Terms & Conditions.");
          valid = false;
        }

        if (valid) {
          $("#registerMessage")
            .text("Registration successful!")
            .removeClass("text-danger")
            .addClass("text-success");
        } else {
          $("#registerMessage")
            .text("Please correct the errors above.")
            .removeClass("text-success")
            .addClass("text-danger");
        }

      });

    });
  </script>

</body>
</html>
