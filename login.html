```html
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - RML Construction Supply</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      position: relative;
      background-color: #ffffff;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('https://i.pinimg.com/736x/ba/f6/29/baf629275e49653b0013ca5ecd4d0361.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0.5;
      z-index: -1;
    }
  </style>
</head>

<body class="bg-light min-vh-100 d-flex align-items-center justify-content-center p-3">

  <div class="card shadow-lg border-danger-subtle rounded-4 w-100" style="max-width: 420px;">

    <div class="card-header bg-danger text-white text-center py-4 rounded-top-4">
      <h2 class="h4 fw-bold mb-1">RML Construction Supply</h2>
      <p class="small mb-0 opacity-75">Sign in to your account</p>
    </div>

    <div class="card-body p-4 p-sm-5 bg-white">

      <form id="loginForm">

        <div class="mb-3">
          <label for="emailInput" class="form-label fw-semibold text-dark">
            Email Address
          </label>

          <input type="text"
                 class="form-control border-danger-subtle"
                 id="emailInput"
                 placeholder="name@example.com">

          <div id="emailError" class="text-danger small mt-1"></div>
        </div>

        <div class="mb-3">
          <label for="passwordInput" class="form-label fw-semibold text-dark">
            Password
          </label>

          <input type="password"
                 class="form-control border-danger-subtle"
                 id="passwordInput"
                 placeholder="Enter your password">

          <div id="passwordError" class="text-danger small mt-1"></div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">

          <div class="form-check">
            <input class="form-check-input"
                   type="checkbox"
                   id="rememberMe">

            <label class="form-check-label small text-muted" for="rememberMe">
              Remember me
            </label>
          </div>

          <a href="#"
             class="small text-danger text-decoration-none fw-semibold">
            Forgot password?
          </a>

        </div>

        <div id="loginMessage" class="small mb-3"></div>

        <button type="submit"
                class="btn btn-danger w-100 py-2 fw-semibold shadow-sm">
          Login
        </button>

      </form>

    </div>

    <div class="card-footer bg-light text-center py-3 rounded-bottom-4 border-0">
      <span class="small text-muted">Don't have an account? </span>

      <a href="register.html"
         class="small text-danger fw-bold text-decoration-none">
        Sign Up
      </a>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>

  <script>
    $(document).ready(function() {

      $("#loginForm").submit(function(e) {
        e.preventDefault();

        var email = $("#emailInput").val().trim();
        var password = $("#passwordInput").val();

        $("#emailError").text("");
        $("#passwordError").text("");
        $("#loginMessage").text("");

        var valid = true;

        if (email === "") {
          $("#emailError").text("Email address is required.");
          valid = false;
        } 
        else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          $("#emailError").text("Please enter a valid email address.");
          valid = false;
        }

        if (password === "") {
          $("#passwordError").text("Password is required.");
          valid = false;
        } 
        else if (password.length < 6) {
          $("#passwordError").text("Password must be at least 6 characters.");
          valid = false;
        }

        if (valid) {
          $("#loginMessage")
            .text("Login successful!")
            .removeClass("text-danger")
            .addClass("text-success");
        } 
        else {
          $("#loginMessage")
            .text("Please correct the errors above.")
            .removeClass("text-success")
            .addClass("text-danger");
        }

      });

    });
  </script>

</body>
</html>
```
